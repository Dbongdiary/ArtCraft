name: Verify backup usability
on:
  workflow_dispatch:
    inputs:
      repositories:
        description: 'JSON repository names to verify (all 66 by default)'
        required: false
        default: '["ActorSpawningPlugin","AniCraft","AnimationTest","artcraft","artcraft-services","artcraftx","Azure-Kinect-Sample-for-Unity","bevy-mocap","cadcraft","cloud-worker","cloudcam","CloudCamPlugin","craft-ai-integrations","craft-common-actions","craft-contrib","craft-fonts","craft-launcher","craft-launcher-assets","craft-libs","craft-repo-status-app","crafthub","deckcraft","designcraft","discord-vocodes","effectcraft","EventCenterPlugin","fakeyou-recast","figcraft","filmcraft","FineTrainers-Conditioning","github-media","gridcraft","hanashi-graphics-demo","html_test","HyperJail","indd-utils","irsa-manager","k4a-sys-temp","lightcraft","LiveScan3D","motion-capture-data","pdfcraft","photocraft","photocraft-corpus","placeholder-artcraft","point-generator","realtime-voice-conversion","redirect-vocodes","RuntimeAudioImporter","RuntimeFilesDownloader","soundcraft","spark","storyteller-bevy","storyteller-ml","StreamTwo","terraform-aws-observability-accelerator","torchscript-models","UE4-OSC","UnrealZeroMQ","vectorcraft","vits-finetuning","voder-proxy","winit","winprint.rs","wordcraft","xsens-packet-send"]'
      previous_run:
        description: 'Optional earlier run ID whose completed evidence should be retained'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: backup-usability-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        repo: ${{ fromJSON(inputs.repositories) }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore from saved bundles and inspect or test
        env:
          AUDIT_REPO: ${{ matrix.repo }}
        run: |
          python3 - <<'PY'
          import os, sys, json, pathlib, subprocess, urllib.request, hashlib, re, time, tomllib, ast, traceback, signal
          BASE='https://raw.githubusercontent.com/Dbongdiary/ArtCraft/1a39bbe21255a55128c503906888e9fb437b2c29/'
          name=os.environ['AUDIT_REPO']; root=pathlib.Path.cwd(); work=root/'restored'; work.mkdir(exist_ok=True); out=root/'audit-results'/name; out.mkdir(parents=True,exist_ok=True)
          result={'repository':name,'backup_commit':'1a39bbe21255a55128c503906888e9fb437b2c29','restored':False,'checks':[],'git_dependencies':[],'missing_paths':[],'model_references':[],'service_domains':[],'limitations':[],'remapped_repositories':[]}
          def clean(s):
           s=re.sub(r'(https?://)[^\s/@]+:[^\s/@]+@',r'\1[REDACTED]@',str(s))
           s=re.sub(r'(gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)', '[REDACTED]',s)
           return s
          
          def safe_exists(path):
           try:return path.exists()
           except OSError:return False
          
          def getjson(path):
           with urllib.request.urlopen(BASE+path,timeout=90) as r:return json.load(r)
          def command(args,cwd=None,timeout=180,label=None):
           start=time.time(); p=subprocess.Popen(args,cwd=cwd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace',start_new_session=True)
           try:txt=p.communicate(timeout=timeout)[0];code=p.returncode
           except subprocess.TimeoutExpired:
            os.killpg(p.pid,signal.SIGKILL);txt=p.communicate()[0];code=124
           txt=clean(txt)
           if label:
            (out/(label+'.log')).write_text(txt[-250000:])
            result['checks'].append({'check':label,'command':args,'exit_code':code,'seconds':round(time.time()-start,1),'tail':txt[-6500:]})
            print(name,label,code,flush=True)
           return code,txt
          
          def require(args,cwd=None,timeout=180):
           c,t=command(args,cwd,timeout)
           if c:raise RuntimeError(clean(' '.join(args))+' failed: '+t[-1500:])
           return t
          
          os.environ.update({'GIT_TERMINAL_PROMPT':'0','GIT_LFS_SKIP_SMUDGE':'1','CARGO_NET_GIT_FETCH_WITH_CLI':'true','CARGO_BUILD_JOBS':'3','CARGO_PROFILE_DEV_DEBUG':'0','CARGO_PROFILE_TEST_DEBUG':'0','SQLX_OFFLINE':'true','CI':'true'})
          require(['git','config','--global','core.hooksPath','/dev/null'])
          require(['git','config','--global','protocol.file.allow','always'])
          for prefix in ['https://github.com/storytold/','http://github.com/storytold/','git@github.com:storytold/','ssh://git@github.com/storytold/']:
           require(['git','config','--global','--add','url.file:///unavailable-originals/.insteadOf',prefix])
          known={r['source'].split('/',1)[1] for r in getjson('.archive/status.json')['repositories']}
          mirrors={}; manifests={}
          def mirror(repo):
           if repo in mirrors:return mirrors[repo]
           if repo not in known:raise RuntimeError('No archived repository '+repo)
           m=getjson('.archive/repositories/'+repo+'.json');manifests[repo]=m
           b=m.get('git_bundle')
           if not b or not b.get('parts'):raise RuntimeError('Empty repository or no bundle: '+repo)
           bundle=root/(repo+'.bundle');whole=hashlib.sha256()
           with bundle.open('wb') as dst:
            for part in b['parts']:
             if not part['url'].startswith('https://github.com/Dbongdiary/ArtCraft/releases/download/'):raise RuntimeError('Unexpected archive asset host')
             h=hashlib.sha256();count=0
             with urllib.request.urlopen(part['url'],timeout=180) as src:
              while True:
               block=src.read(1024*1024)
               if not block:break
               h.update(block);whole.update(block);dst.write(block);count+=len(block)
             if h.hexdigest()!=part['sha256'] or count!=part['bytes']:raise RuntimeError('Asset checksum mismatch')
           if whole.hexdigest()!=b['whole_sha256']:raise RuntimeError('Whole bundle checksum mismatch')
           dest=root/'mirrors'/(repo+'.git');dest.parent.mkdir(exist_ok=True)
           require(['git','clone','--mirror',str(bundle),str(dest)],timeout=600);bundle.unlink()
           require(['git','--git-dir='+str(dest),'fsck','--full'],timeout=600)
           mirrors[repo]=dest
           for prefix in ['https://github.com/storytold/'+repo,'http://github.com/storytold/'+repo,'git@github.com:storytold/'+repo,'ssh://git@github.com/storytold/'+repo]:
            for suffix in ['', '.git']:
             require(['git','config','--global','--add','url.'+dest.as_uri()+'.insteadOf',prefix+suffix])
           result['remapped_repositories'].append(repo)
           return dest
          
          def restore(repo):
           dest=work/repo
           if dest.exists():return dest
           mdir=mirror(repo);m=manifests[repo]
           require(['git','clone','--no-checkout',str(mdir),str(dest)],timeout=600)
           require(['git','checkout','--detach',m['default_commit']],dest,600)
           if require(['git','rev-parse','HEAD'],dest).strip()!=m['default_commit']:raise RuntimeError('Commit verification failed')
           return dest
          
          def walkfiles(p):
           for d,dirs,files in os.walk(p):
            dirs[:]=[x for x in dirs if x not in ['.git','node_modules','target','.venv','venv','__pycache__']]
            for f in files:
             q=pathlib.Path(d)/f
             if not q.is_symlink() and q.stat().st_size<2000000:yield q
          
          def cargo_tables(obj):
           if isinstance(obj,dict):
            if any(k in obj for k in ['git','path']):yield obj
            for v in obj.values():yield from cargo_tables(v)
           elif isinstance(obj,list):
            for v in obj:yield from cargo_tables(v)
          
          import tarfile
          
          def download_verified(meta,dest):
           whole=hashlib.sha256();size=0
           with dest.open('wb') as dst:
            for part in meta['parts']:
             if not part['url'].startswith('https://github.com/Dbongdiary/ArtCraft/releases/download/'):raise RuntimeError('Unexpected archive host')
             h=hashlib.sha256();n=0
             with urllib.request.urlopen(part['url'],timeout=180) as src:
              for block in iter(lambda:src.read(1024*1024),b''):
               dst.write(block);h.update(block);whole.update(block);n+=len(block);size+=len(block)
             if n!=part['bytes'] or h.hexdigest()!=part['sha256']:raise RuntimeError('Archive part mismatch')
           if size!=meta['bytes'] or whole.hexdigest()!=meta['whole_sha256']:raise RuntimeError('Whole archive mismatch')
          
          def gout(args,cwd):
           p=subprocess.run(['git','-c','core.hooksPath=/dev/null',*args],cwd=cwd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env={**os.environ,'GIT_ALLOW_PROTOCOL':'file','GIT_LFS_SKIP_SMUDGE':'1'},timeout=600)
           if p.returncode:raise RuntimeError('Git restore verification failed: '+args[0]+' exit '+str(p.returncode))
           return p.stdout.decode()
          
          def hashfile(p):
           h=hashlib.sha256()
           with p.open('rb') as f:
            for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
           return h.hexdigest()
          
          def restore_lfs(repo,mdir,metadata):
           lfs=metadata['lfs']
           if lfs['status']=='not_present':return {'status':'not_present'}
           if lfs['status']!='complete':raise RuntimeError('Saved LFS archive incomplete')
           tarpath=root/'lfs.tar';download_verified(lfs['archive'],tarpath)
           gitdir=pathlib.Path(gout(['rev-parse','--absolute-git-dir'],repo).strip());got={};total=0
           with tarfile.open(tarpath,'r|') as tf:
            for member in tf:
             if member.isdir() and member.name.startswith('lfs/objects'):continue
             match=re.fullmatch(r'lfs/objects/([0-9a-f]{2})/([0-9a-f]{2})/([0-9a-f]{64})',member.name)
             if not member.isfile() or not match:raise RuntimeError('Unexpected LFS tar member')
             aa,bb,oid=match.groups()
             if (aa,bb)!=(oid[:2],oid[2:4]) or oid in got:raise RuntimeError('Invalid LFS member')
             dest=gitdir/member.name;dest.parent.mkdir(parents=True,exist_ok=True);h=hashlib.sha256();size=0
             if not dest.resolve().is_relative_to(gitdir.resolve()):raise RuntimeError('LFS path escape')
             with tf.extractfile(member) as src,dest.open('wb') as dst:
              for block in iter(lambda:src.read(1024*1024),b''):dst.write(block);h.update(block);size+=len(block)
             if h.hexdigest()!=oid or size!=member.size:raise RuntimeError('LFS payload mismatch')
             got[oid]=size;total+=size
           if len(got)!=lfs['object_count'] or total!=lfs['bytes']:raise RuntimeError('LFS count mismatch')
           historical=json.loads(gout(['lfs','ls-files','--all','--json'],mdir))['files']
           if {x['oid'] for x in historical}!=set(got):raise RuntimeError('Historical LFS coverage mismatch')
           current=json.loads(gout(['lfs','ls-files','--json'],repo))['files']
           gout(['-c','lfs.url=file:///unavailable-original-lfs','-c','lfs.storage='+str(gitdir/'lfs'),'lfs','checkout'],repo)
           for item in current:
            p=repo/item['name']
            if p.is_symlink() or not p.resolve().is_relative_to(repo.resolve()) or p.stat().st_size!=item['size'] or hashfile(p)!=item['oid']:raise RuntimeError('LFS checkout mismatch')
           tarpath.unlink();return {'status':'verified_and_materialized','historical_objects':len(got),'bytes':total,'current_files':len(current)}
          
          def restore_dependencies(repo):
           cache={};checked=[]
           for link in getjson('.archive/dependencies/roots.json'):
            if link['parent']!='storytold/'+name:continue
            rec={'path':link['path'],'pin':link['pin']};checked.append(rec)
            if not link.get('dependency_graph_complete'):
             rec.update(status='known_unavailable',reason=link.get('error'));continue
            try:
             assert link['parent_commit']==manifests[name]['default_commit']
             path=pathlib.PurePosixPath(link['path']);assert not path.is_absolute() and not any(x in ('..','.git') for x in path.parts)
             assert all(not (repo.joinpath(*path.parts[:i])).is_symlink() for i in range(1,len(path.parts)+1))
             entry=gout(['--literal-pathspecs','ls-tree','-z','HEAD','--',str(path)],repo);header,actual=entry.rstrip('\0').split('	',1)
             assert actual==str(path) and header=='160000 commit '+link['pin']
             source=link['source'];pin=link['pin'];key=(source,pin)
             assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',source) and re.fullmatch(r'[0-9a-f]{40}',pin)
             node=getjson('.archive/dependencies/nodes/'+source+'/'+pin+'.json')
             assert node['source']==source and node['pin']==pin and node['source_archive_complete']
             assert node['children']==[] and node['lfs']['status']=='not_present'
             if key not in cache:
              basedir=root/'dependency-cache'/source/pin;basedir.mkdir(parents=True,exist_ok=True);bundle=basedir/'source.bundle';mdir=basedir/'mirror.git'
              download_verified(node['git_bundle'],bundle);gout(['clone','--mirror',str(bundle),str(mdir)],root);gout(['--git-dir='+str(mdir),'fsck','--full','--no-reflogs'],root)
              refs=gout(['--git-dir='+str(mdir),'for-each-ref','--format=%(objectname) %(refname)'],root).splitlines();assert sorted(refs)==sorted(node['refs'])
              assert gout(['--git-dir='+str(mdir),'rev-parse',pin+'^{tree}'],root).strip()==node['source_tree'];bundle.unlink();cache[key]=mdir
             dest=repo.joinpath(*path.parts);assert not dest.exists() or (dest.is_dir() and not any(dest.iterdir()));dest.parent.mkdir(parents=True,exist_ok=True)
             gout(['clone','--no-checkout',str(cache[key]),str(dest)],root);gout(['checkout','--detach',pin],dest)
             assert gout(['rev-parse','HEAD'],dest).strip()==pin and gout(['rev-parse','HEAD^{tree}'],dest).strip()==node['source_tree']
             assert gout(['status','--porcelain','--untracked-files=all'],dest)==''
             rec.update(status='verified_and_materialized',source=source,tree=node['source_tree'])
            except Exception as e:rec.update(status='verification_failed',error=type(e).__name__+': '+clean(e))
           return checked
          
          try:
           if name=='AniCraft':
            result['status']='empty_repository';result['limitations'].append('No application source was present at capture time.')
           else:
            repo=restore(name); result['restored']=True;result['source_commit']=manifests[name]['default_commit'];result['restore_proof']='Bundle SHA256 and git fsck passed; checked out recorded default commit, without contacting source repository.'
            if name in ['figcraft','gridcraft','wordcraft','vectorcraft','deckcraft','designcraft','cadcraft','effectcraft','filmcraft','lightcraft','pdfcraft','photocraft','soundcraft']:
             fonts=restore('craft-fonts');os.environ['CRAFT_FONTS_DIR']=str(fonts);result['font_source_commit']=manifests['craft-fonts']['default_commit']
            if name in ['storyteller-ml','torchscript-models']:
             result['lfs_restore']=restore_lfs(repo,mirrors[name],manifests[name]);result['dependency_restores']=restore_dependencies(repo)
            # Resolve source-hosted Git dependencies exclusively through our bundle mirrors.
            queue=[repo]; scanned=set(); gitrefs=set(); domains=set(); modelrefs=set(); allfiles=list(walkfiles(repo)); cargos=[]; pycount=0; pyerrors=[]
            for f in allfiles:
             rel=str(f.relative_to(repo))
             if f.name in ['Cargo.toml','Cargo.lock']:
              s=f.read_text(errors='replace')
              for dep in re.findall(r'github\.com/storytold/([A-Za-z0-9_.-]+)',s):
               dep=dep.removesuffix('.git')
               if dep!=name and dep in known:
                try:mirror(dep)
                except Exception as e:result['limitations'].append('Mirror '+dep+': '+clean(e))
              for u in re.findall(r'(?:git\+)?https://github\.com/[^\s\"<>]+',s):
               if 'git+' in u or 'git = ' in s:gitrefs.add(u[:250])
             if f.name=='Cargo.toml':
              cargos.append(f)
              try:
               for tab in cargo_tables(tomllib.loads(f.read_text())):
                if 'git' in tab:gitrefs.add(tab['git']+('#'+tab.get('rev','') if tab.get('rev') else ''))
                if 'path' in tab and isinstance(tab['path'],str):
                 target=(f.parent/tab['path']).resolve()
                 if not target.exists():
                  try:part=target.relative_to(work).parts[0]
                  except ValueError:part=None
                  if part in known and part!=name:
                   try:restore(part)
                   except Exception as e:result['limitations'].append('Sibling '+part+': '+clean(e))
                  if not target.exists():result['missing_paths'].append({'manifest':rel,'path':tab['path']})
              except Exception as e:result['limitations'].append('Manifest '+rel+': '+clean(e))
             if f.suffix in ['.rs','.py','.toml','.json','.md','.sh','.yml','.yaml','.ts','.tsx','.js']:
              s=f.read_text(errors='replace')
              for host in re.findall(r'https?://([A-Za-z0-9.-]+)',s):
               if any(x in host for x in ['fakeyou','vocodes','storyteller','storytold','artcraft','craftapps','huggingface','amazonaws','openai','replicate','fal.ai','grok','midjourney','worldlabs']):domains.add(host)
              for ref in re.findall(r'[\"\x27]([^\"\x27\n]{1,180}\.(?:onnx|pth|ckpt|safetensors|pt))[\"\x27]',s):
               if not safe_exists(f.parent/ref) and not safe_exists(repo/ref):modelrefs.add((rel,ref))
             if f.suffix=='.py':
              pycount+=1
              try:ast.parse(f.read_text(errors='replace'))
              except SyntaxError as e:pyerrors.append({'file':rel,'line':e.lineno,'error':str(e.msg)})
            result['git_dependencies']=sorted(gitrefs);result['service_domains']=sorted(domains);result['model_references']=[{'file':a,'reference':b} for a,b in sorted(modelrefs)][:400]
            result['python_syntax']={'files_checked':pycount,'errors':pyerrors[:100]}
            result['submodule_references']=manifests[name].get('submodules',[])
            result['lfs_status']=manifests[name].get('lfs',{}).get('status')
            if result['submodule_references'] and not result.get('dependency_restores'):result['limitations'].append('Submodules require separately archived dependency restoration; original bundle preserves gitlinks. Full ML execution not attempted.')
            if result['lfs_status']=='complete' and not result.get('lfs_restore'):result['limitations'].append('LFS payloads exist in separate archive; this build check does not materialize them.')
            if modelrefs:result['limitations'].append('Model filename references are candidates for missing runtime inputs, not proof that every reference is mandatory.')
            result['status']='source_restored_runtime_unverified'
            result['configuration_redactions']=[]
            for config in allfiles:
             if config.name=='.npmrc':
              lines=config.read_text(errors='replace').splitlines();safe=[line for line in lines if not re.search(r'(?i)(?:_auth(?:token)?|_password|password|username)\s*=',line)]
              if safe!=lines:config.write_text('\n'.join(safe)+'\n');result['configuration_redactions'].append(str(config.relative_to(repo)))
            os.environ.update({'HUSKY':'0','NPM_CONFIG_USERCONFIG':'/dev/null'})
            jsroots=[]
            if (repo/'package.json').exists():jsroots.append(repo)
            if (repo/'frontend'/'package.json').exists():jsroots.append(repo/'frontend')
            result['javascript_checks']=[]
            for jsroot in jsroots:
             pkg=json.loads((jsroot/'package.json').read_text());tag='npm-'+jsroot.name
             prerequisite=True
             if name=='storyteller-bevy':
              pc,_=command(['rustup','target','add','wasm32-unknown-unknown'],repo,300,label='frontend-wasm-target');prerequisite=pc==0
             if name=='spark':
              pc,_=command(['rustup','toolchain','install','stable','--profile','minimal'],repo,300,label='wasm-rust-toolchain');wc,_=command(['node','rust/build_wasm.js'],repo,900,label='wasm-package');prerequisite=pc==0 and wc==0
             if not prerequisite:
              result['javascript_checks'].append({'directory':str(jsroot.relative_to(repo)),'checks_run':0,'status':'prerequisite_blocked'});continue
             c,t=command(['npm','ci','--no-audit','--no-fund'] if (jsroot/'package-lock.json').exists() else ['npm','install','--no-audit','--no-fund'],jsroot,480,label=tag+'-install')
             passed=c==0;ran=0
             if c==0:
              for k in ['typecheck','test','build']:
               if k in pkg.get('scripts',{}):
                c,t=command(['npm','run',k],jsroot,480,label=tag+'-'+k);passed=passed and c==0;ran+=1
              if name in ['artcraft','artcraftx'] and jsroot.name=='frontend':
               os.environ['NX_DAEMON']='false';c,t=command(['npx','--no-install','nx','run','artcraft:build','--skipNxCache'],jsroot,600,label='frontend-build');passed=passed and c==0;ran+=1
              if name=='storyteller-bevy':
               c,t=command(['npx','--no-install','nx','run','studio-frontend:build:production'],jsroot,600,label='studio-frontend-build');passed=passed and c==0;ran+=1
             result['javascript_checks'].append({'directory':str(jsroot.relative_to(repo)),'checks_run':ran,'status':('checks_passed' if ran else 'install_only') if passed else 'blocked'})
            if (repo/'Cargo.toml').exists():
             result['kind']='rust'
             # Read transitive manifest dependencies in the exact historical mirrors too.
             for dep,mdir in list(mirrors.items()):
              lock=repo/'Cargo.lock'
              if lock.exists():
               for rev in re.findall(r'github\.com/storytold/'+re.escape(dep)+r'(?:\.git)?[^\"\n]*#([0-9a-f]{40})',lock.read_text()):
                c,t=command(['git','--git-dir='+str(mdir),'cat-file','-e',rev+'^{commit}'])
                if c:result['limitations'].append('Pinned dependency commit unavailable: '+dep+'@'+rev)
             command(['sudo','apt-get','update','-qq'],timeout=180,label='system-index')
             command(['sudo','apt-get','install','-y','--no-install-recommends','pkg-config','libssl-dev','libasound2-dev','libudev-dev','libxkbcommon-dev','libxkbcommon-x11-0','libwayland-dev','libxcb-shape0-dev','libxcb-xfixes0-dev','libgtk-3-dev','libvulkan1','mesa-vulkan-drivers','xvfb','protobuf-compiler','clang','cmake','libfontconfig1-dev','libdbus-1-dev','libwebkit2gtk-4.1-dev','libayatana-appindicator3-dev','librsvg2-dev','libxdo-dev','libzmq3-dev','libsodium-dev','poppler-utils','python3-pil'],timeout=240,label='system-dependencies')
             if name=='voder-proxy':command(['sudo','apt-get','install','-y','libpcre3-dev'],timeout=180,label='project-system-dependencies')
             if name=='artcraft-services':command(['sudo','apt-get','install','-y','ffmpeg','libavcodec-dev','libavformat-dev','libavutil-dev','libavfilter-dev','libavdevice-dev','libswscale-dev','libswresample-dev','libpulse-dev'],timeout=240,label='project-system-dependencies')
             runtime=root/'xdg-runtime';runtime.mkdir(mode=0o700,exist_ok=True);os.environ['XDG_RUNTIME_DIR']=str(runtime)
             result['archive_contains_cargo_lock']=(repo/'Cargo.lock').exists();lock_args=['--locked'] if result['archive_contains_cargo_lock'] else []
             if not lock_args:result['limitations'].append('No Cargo.lock was archived; dependency resolution uses packages available at verification time, so future resolution may differ.')
             tool='stable'
             tfile=repo/'rust-toolchain.toml'
             if tfile.exists():tool=tomllib.loads(tfile.read_text()).get('toolchain',{}).get('channel','stable')
             elif (repo/'rust-toolchain').exists():tool=(repo/'rust-toolchain').read_text().strip()
             c,_=command(['rustup','toolchain','install',tool,'--profile','minimal'],timeout=300,label='rust-toolchain')
             c,t=command(['cargo','+'+tool,'metadata','--format-version','1','--no-deps'],repo,180,label='cargo-metadata')
             if c==0:
              meta=json.loads(next(line for line in t.splitlines() if line.startswith('{')));result['cargo_packages']=[{'name':p['name'],'targets':[{'name':x['name'],'kind':x['kind']} for x in p['targets']]} for p in meta['packages']]
              c,t=command(['cargo','+'+tool,'test','--workspace']+lock_args,repo,900,label='cargo-tests')
              b,bt=command(['cargo','+'+tool,'build','--workspace','--bins']+lock_args,repo,600,label='cargo-build')
              result['status']='build_and_tests_passed' if c==0 and b==0 else 'build_or_tests_blocked'
              bins=[x['name'] for p in meta['packages'] for x in p['targets'] if 'bin' in x['kind']]
              appbins=[x for x in bins if x==name or x==name.replace('-','_')]
