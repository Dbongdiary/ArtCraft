  publish:
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.archive/verification/
            /README.md
      - name: Recover completed earlier evidence
        if: inputs.previous_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.previous_run }}
          pattern: verification-*
          path: baseline-results
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-*
          path: results
          merge-multiple: true
      - name: Publish per-repository evidence
        env:
          BASELINE_RUN: ${{ inputs.previous_run }}
        run: |
          python3 - <<'PY'
          import pathlib,json,os,collections
          base=pathlib.Path('.archive/verification');base.mkdir(parents=True,exist_ok=True)
          existing={f.stem:json.loads(f.read_text()) for f in base.glob('*.json') if f.name!='summary.json'}
          previous_summary=json.loads((base/'summary.json').read_text()) if (base/'summary.json').exists() else {}
          for n,r in existing.items():
           if not r.get('verification_run') and previous_summary.get('run'):r['verification_run']=previous_summary['run'];(base/(n+'.json')).write_text(json.dumps(r,indent=2))
          baseline=os.environ.get('BASELINE_RUN','')
          for f in pathlib.Path('baseline-results').rglob('result.json'):
           r=json.loads(f.read_text());n=r.get('repository','')
           if not n or '/' in n or '..' in n:continue
           r['verification_run']='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+baseline;existing[n]=r;(base/(n+'.json')).write_text(json.dumps(r,indent=2))
          rows=[]
          for f in pathlib.Path('results').rglob('result.json'):
           r=json.loads(f.read_text());n=r.get('repository','')
           if not n or '/' in n or '..' in n:continue
           r['verification_run']='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'];existing[n]=r;(base/(n+'.json')).write_text(json.dumps(r,indent=2))
          rows=list(existing.values())
          rows.sort(key=lambda x:x['repository'].lower())
          run='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          lines=['# Backup usability verification','', 'GitHub-hosted audit run: '+run,'','Source snapshot: 1a39bbe21255a55128c503906888e9fb437b2c29. All restoration, downloads, builds and tests ran on ephemeral GitHub runners. No repository was cloned or built on the owner\'s Mac.','', '## Meaning of the results','', 'A verified restore proves the saved Git bundle can be checked out independently of the original repository. Git URLs for archived Storytold dependencies are redirected to checksum-verified local mirrors on the runner. Other package registries and third-party sources remain available; this is not a fully offline or feature-complete certification.','', 'Passing library tests/builds is narrower than working interactive editing, exports, AI inference, hardware capture or hosted integrations. Python syntax checks are not execution tests. Missing models and service domains are evidence to review, not a claim every occurrence is required.','', 'See [REQUIREMENTS.md](REQUIREMENTS.md) for manually confirmed source, model, service, SDK and release-asset gaps.','', '## Repository results','', '| Repository | Restore | Build/test result | JavaScript | Sample workflow | Virtual display | Details |','|---|---|---|---|---|---|---|']
          for r in rows:
           n=r['repository'];lines.append('| '+n+' | '+('verified' if r.get('restored') else 'not verified / empty')+' | '+r.get('status','unknown')+' | '+('; '.join((j.get('directory') or 'root')+': '+j.get('status','unknown') for j in r.get('javascript_checks',[])) or 'not tested')+' | '+r.get('sample_workflow','not tested')+' | '+r.get('headless_launch','not tested')+' | ['+r.get('kind','details')+']('+n+'.json) |')
          counts=dict(collections.Counter(r.get('status','unknown') for r in rows))
          lines+=['','## Coverage','',json.dumps(counts,sort_keys=True),'',str(len(rows))+' repository result files received. Any omitted repository is unverified.','', '## Concrete missing source paths','']
          for r in rows:
           for p in r.get('missing_paths',[]):lines.append('- '+r['repository']+': '+p['manifest']+' -> '+p['path'])
          lines+=['','## Original Git references and service/model requirements','', 'Each repository JSON records pinned Git dependencies, missing Cargo paths, model filename references, service domains, exact commands, exit codes and limitations. Logs and generated sample files are retained in the GitHub Actions artifacts of each result JSON\'s verification_run. Results can come from more than one run. Original releases/installers, hosted databases, API credentials, paid plugins and external model downloads are not automatically preserved by a source archive.','', 'The previously unavailable moonTripoSR and glow-tts-multispeaker references remain unresolved. See ../dependencies/status.json.']
          (base/'README.md').write_text('\n'.join(lines)+'\n');(base/'summary.json').write_text(json.dumps({'run':run,'result_count':len(rows),'counts':counts,'repositories':[{'name':r['repository'],'status':r.get('status'),'restored':r.get('restored'),'sample_workflow':r.get('sample_workflow'),'headless_launch':r.get('headless_launch'),'javascript_checks':r.get('javascript_checks',[]),'verification_run':r.get('verification_run')} for r in rows]},indent=2))
          readme=pathlib.Path('README.md');s=readme.read_text();marker='## Backup usability verification'
          if marker in s:s=s.split(marker)[0].rstrip()+'\n'
          s+='\n'+marker+'\n\nSee [.archive/verification/README.md](.archive/verification/README.md) for GitHub-hosted restore/build checks and unresolved runtime requirements. A source backup is not a guarantee that every app or hosted feature works. Backup workflows do not execute source; the separately requested verification workflow runs builds/tests on ephemeral GitHub runners.\n'
          readme.write_text(s)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines))
          
          PY
      - name: Save report in archive
        run: |
          git config user.name 'ArtCraft Verification'
          git config user.email 'actions@users.noreply.github.com'
          git add .archive/verification README.md
          git diff --cached --quiet || git commit -m 'Record GitHub-hosted backup usability verification'
          git push origin HEAD:main
